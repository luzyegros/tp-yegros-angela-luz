<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Explorador de Personajes | Rick and Morty</title>

  <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

  <header class="encabezado">
    <div>
      <p class="etiqueta">API REST</p>
      <h1>Explorador de Personajes</h1>
    </div>

    <p>Rick and Morty</p>
  </header>

  <main>

    <section class="buscador" aria-labelledby="titulo-buscador">

      <h2 id="titulo-buscador">Buscar personajes</h2>

      <form id="formulario">

        <div class="campo">
          <label for="nombre">Nombre</label>

          <input
            id="nombre"
            name="nombre"
            type="text"
            placeholder="Ej.: Rick"
          >
        </div>

        <div class="campo">
          <label for="estado">Estado</label>

          <select id="estado" name="estado">
            <option value="">Todos</option>
            <option value="alive">Vivo</option>
            <option value="dead">Muerto</option>
            <option value="unknown">Desconocido</option>
          </select>
        </div>

        <button id="botonBuscar" type="submit">
          Buscar
        </button>

      </form>

      <p
        id="mensaje"
        class="mensaje"
        role="status"
        aria-live="polite"
      ></p>

    </section>

    <section class="seccion-resultados" aria-labelledby="titulo-resultados">

      <div class="cabecera-resultados">
        <h2 id="titulo-resultados">Resultados</h2>

        <p id="contador" hidden></p>
      </div>

      <div id="resultados" class="resultados"></div>

    </section>

  </main>

  <footer>
    <p>Angela Luz Yegros · Fundamentos de Desarrollo Web</p>
  </footer>

  <script src="js/app.js"></script>

</body>
</html>
